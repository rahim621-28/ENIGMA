[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma"
version = "0.2.0"
description = "Autonomous incident triage agent: crash log -> AST analysis -> sandboxed repro -> patch -> PR"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
gemini = ["google-generativeai"]
openai = ["openai"]
server = ["fastapi", "uvicorn"]
dev = ["pytest"]

[project.scripts]
enigma = "enigma.cli:app"

[tool.setuptools.packages.find]
include = ["enigma*"]
